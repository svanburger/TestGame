<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bajskorv Studios">
  <meta name="theme-color" content="#1b2a4a">
  <title>Bajskorv Studios – Våra spel</title>
  <style>
    /* Menyn: en rubrik och ett stort kort per spel. Lägg till fler kort längre ner. */
    :root {
      --himmel: #1b2a4a;
      --himmel-nere: #3d5f94;
      --text: #ffffff;
      --text-svag: #d5def0;
      --typsnitt: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    html {
      min-height: 100%;
      background: linear-gradient(var(--himmel), var(--himmel-nere)) fixed;
      color: var(--text);
      font-family: var(--typsnitt);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding-block: calc(env(safe-area-inset-top, 0px) + 32px) calc(env(safe-area-inset-bottom, 0px) + 32px);
      padding-inline: max(20px, env(safe-area-inset-left, 0px)) max(20px, env(safe-area-inset-right, 0px));
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      gap: 28px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5.5vw, 2.8rem);
      text-align: center;
      text-wrap: balance;
    }

    /* Loggan: Bajskorv Studios */
    .logga {
      display: grid;
      justify-items: center;
      gap: 4px;
    }

    .logga svg {
      width: min(560px, 100%);
      height: auto;
      overflow: visible;
    }

    .logga-text {
      font-family: var(--typsnitt);
      font-weight: 900;
      paint-order: stroke;
      stroke-linejoin: round;
    }

    .presenterar {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-svag);
    }

    /* Bågen ritas fram, sedan hoppar bajskorven in och landar på bokstäverna */
    .bage {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: rita-bage 1.4s ease-in-out 0.2s forwards;
    }

    .glitter {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: glittra 2.4s ease-in-out 1.5s infinite;
    }

    .korv {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: hoppa-in 1.3s ease-out both, vicka 3s ease-in-out 1.5s infinite;
    }

    .ogon {
      transform-box: fill-box;
      transform-origin: center;
      animation: blinka 4s 2s infinite;
    }

    @keyframes rita-bage {
      to { stroke-dashoffset: 0; }
    }

    @keyframes glittra {
      0%, 100% { opacity: 0; transform: scale(0.4) rotate(0deg); }
      40% { opacity: 1; transform: scale(1) rotate(45deg); }
      70% { opacity: 0; transform: scale(0.4) rotate(90deg); }
    }

    @keyframes hoppa-in {
      0% { transform: translate(-260px, -40px) scale(1, 1); }
      30% { transform: translate(-130px, -120px) scale(0.95, 1.05); }
      55% { transform: translate(0, 0) scale(1.2, 0.75); }
      70% { transform: translate(0, -36px) scale(0.92, 1.1); }
      85% { transform: translate(0, 0) scale(1.1, 0.88); }
      100% { transform: translate(0, 0) scale(1, 1); }
    }

    @keyframes vicka {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-4deg); }
      75% { transform: rotate(4deg); }
    }

    @keyframes blinka {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }

    .spel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .kort {
      display: grid;
      justify-items: center;
      gap: 8px;
      padding: 28px 20px;
      border-radius: 28px;
      color: #2b1d0e;
      text-decoration: none;
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.25);
      transition: transform 0.1s;
      touch-action: manipulation;
    }

    .kort:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25);
    }

    .kort:focus-visible {
      outline: 4px solid #ffffff;
      outline-offset: 4px;
    }

    .kort-stjarnor { background: #ffd95e; }
    .kort-parkour { background: #ffab6b; }
    .kort-pappa { background: #9fd8c9; }
    .kort-fis { background: #c9e58f; }

    .ikon {
      font-size: 5rem;
      line-height: 1;
    }

    .namn {
      font-size: 1.7rem;
      font-weight: 800;
    }

    .beskrivning {
      font-size: 1.05rem;
      text-align: center;
      max-width: 30ch;
    }

    @media (prefers-reduced-motion: reduce) {
      .kort { transition: none; }
      .bage { animation: none; stroke-dashoffset: 0; }
      .glitter { animation: none; opacity: 1; }
      .korv, .ogon { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <header class="logga">
      <svg viewBox="0 0 600 260" role="img" aria-labelledby="loggaNamn">
        <title id="loggaNamn">Bajskorv Studios</title>
        <defs>
          <linearGradient id="guld" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff6c2"/>
            <stop offset="0.5" stop-color="#ffd23f"/>
            <stop offset="1" stop-color="#f29a1f"/>
          </linearGradient>
          <linearGradient id="brun" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#b9783c"/>
            <stop offset="1" stop-color="#7a4a22"/>
          </linearGradient>
        </defs>

        <!-- Den gyllene bågen över loggan -->
        <path class="bage" pathLength="1" d="M 60 168 Q 300 -95 540 168" fill="none" stroke="url(#guld)" stroke-width="5" stroke-linecap="round"/>
        <path class="glitter" d="M 540 150 l 5 13 l 13 5 l -13 5 l -5 13 l -5 -13 l -13 -5 l 13 -5 z" fill="#fff6c2"/>
        <path class="glitter" style="animation-delay: 2.3s" d="M 120 92 l 3 8 l 8 3 l -8 3 l -3 8 l -3 -8 l -8 -3 l 8 -3 z" fill="#fff6c2"/>
        <path class="glitter" style="animation-delay: 2.9s" d="M 470 72 l 3 8 l 8 3 l -8 3 l -3 8 l -3 -8 l -8 -3 l 8 -3 z" fill="#fff6c2"/>

        <!-- Bajskorven -->
        <g class="korv">
          <g stroke="#4a2a12" stroke-width="4" stroke-linejoin="round" fill="url(#brun)">
            <path d="M 300 52 q 14 6 10 20 q 20 4 18 18 q 30 6 28 26 q -2 22 -56 22 q -54 0 -56 -22 q -2 -20 28 -26 q -2 -14 18 -18 q 6 -10 10 -20 z"/>
            <path d="M 276 90 q 24 8 50 0" fill="none"/>
            <path d="M 262 116 q 38 10 76 0" fill="none"/>
          </g>
          <ellipse cx="286" cy="66" rx="6" ry="3" fill="#ffffff" opacity="0.45"/>
          <ellipse cx="270" cy="104" rx="9" ry="4" fill="#ffffff" opacity="0.35"/>
          <g class="ogon">
            <circle cx="288" cy="101" r="7" fill="#ffffff" stroke="#4a2a12" stroke-width="2"/>
            <circle cx="312" cy="101" r="7" fill="#ffffff" stroke="#4a2a12" stroke-width="2"/>
            <circle cx="290" cy="102" r="3.5" fill="#1a1a1a"/>
            <circle cx="314" cy="102" r="3.5" fill="#1a1a1a"/>
          </g>
          <circle cx="277" cy="113" r="5" fill="#ff8f8f" opacity="0.6"/>
          <circle cx="323" cy="113" r="5" fill="#ff8f8f" opacity="0.6"/>
          <path d="M 291 114 q 9 9 18 0" fill="none" stroke="#4a2a12" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- Namnet -->
        <text class="logga-text" x="300" y="200" text-anchor="middle" font-size="78" letter-spacing="2" fill="url(#guld)" stroke="#4a2a12" stroke-width="10">BAJSKORV</text>
        <line x1="128" y1="236" x2="208" y2="236" stroke="url(#guld)" stroke-width="3" stroke-linecap="round"/>
        <line x1="392" y1="236" x2="472" y2="236" stroke="url(#guld)" stroke-width="3" stroke-linecap="round"/>
        <text class="logga-text" x="306" y="245" text-anchor="middle" font-size="26" letter-spacing="12" fill="#ffffff">STUDIOS</text>
      </svg>
      <p class="presenterar">presenterar</p>
    </header>
    <h1>Våra spel</h1>
    <nav class="spel">
      <a class="kort kort-stjarnor" href="stjarnor/">
        <span class="ikon">⭐</span>
        <span class="namn">Fånga stjärnorna</span>
        <span class="beskrivning">Fånga det som faller och undvik bomberna.</span>
      </a>
      <a class="kort kort-parkour" href="parkour/">
        <span class="ikon">🐱</span>
        <span class="namn">Parkourkatten</span>
        <span class="beskrivning">Hoppa, gör volter och akta dig för de onda djuren.</span>
      </a>
      <a class="kort kort-pappa" href="pappa/">
        <span class="ikon">🛋️</span>
        <span class="namn">Låt pappa vila</span>
        <span class="beskrivning">Lek och städa – men tyst, så att pappa får vila.</span>
      </a>
      <a class="kort kort-fis" href="fis/">
        <span class="ikon">💨</span>
        <span class="namn">Lagom tryck</span>
        <span class="beskrivning">Fisa så mycket du kan – men tryck inte för hårt!</span>
      </a>
    </nav>
  </main>
</body>
</html>

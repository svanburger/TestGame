<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <!-- Gör att spelet fyller skärmen på iPad/telefon och inte går att zooma -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <!-- Gör att spelet startar i helskärm när man lagt det på hemskärmen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lagom tryck">
  <meta name="theme-color" content="#cfd6de">
  <title>Lagom tryck</title>
  <link rel="stylesheet" href="../spel.css">
</head>
<body>
  <canvas id="spel"></canvas>
  <div class="knappar">
    <a id="hem" class="rund-knapp" href="../" aria-label="Till menyn">🏠</a>
    <button id="paus" class="rund-knapp" type="button" aria-label="Pausa" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>
    </button>
  </div>
  <div id="pausmeny" class="pausmeny" hidden>
    <div class="pausruta" role="dialog" aria-labelledby="paustitel">
      <h2 id="paustitel">Paus</h2>
      <button id="fortsatt" class="menyknapp" type="button">▶ Fortsätt</button>
      <button id="borjaOm" class="menyknapp sekundar" type="button">↻ Börja om</button>
      <button id="musikKnapp" class="menyknapp sekundar" type="button">♪ Musik: på</button>
      <a class="menyknapp sekundar" href="../">🏠 Till menyn</a>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
